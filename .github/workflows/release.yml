name: Release

on:
  push:
    branches: [ main ]
  # Manual trigger. Use it to publish again after a configuration or registry
  # failure. If the registry already has the version, the run does nothing.
  workflow_dispatch:

# No permissions by default. Each job requests only the permissions it needs.
permissions: {}

jobs:
  # This job opens and updates a release PR. The PR sets the version and the
  # CHANGELOG.md from Conventional Commits. A merge of the PR creates the git
  # tag and the GitHub release.
  release-please:
    # Only the upstream repository sets versions. A fork has no upstream tags,
    # so release-please on a fork calculates incorrect versions. Forks get
    # versions from upstream through a rebase.
    # See docs/decisions/0012-fork-publishing-by-rebase.md.
    # Keep this repository name equal to UPSTREAM_REPO in the publish step.
    if: github.repository == 'cadesalaberry/vitest-sentry-reporter'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # This job publishes the package.
  #
  # When the job runs (see docs/decisions/0012-fork-publishing-by-rebase.md):
  #   - Upstream: only when release-please made a release. One publication for
  #     each version, with OIDC.
  #   - Forks: on each push to main and on manual dispatch. If the registry
  #     already has the package.json version, or if NPM_TOKEN is not set, the
  #     publish step stops without an error.
  #
  # Authentication. The NPM_TOKEN secret selects the path. Forks do not edit
  # this file:
  #   1. NPM_TOKEN not set (upstream): npm Trusted Publishing (OIDC) with
  #      provenance. This requires a Trusted Publisher for the package on
  #      npmjs.com (repository + this workflow file). See ADR-0006, ADR-0011.
  #   2. NPM_TOKEN set (forks / private registries): token authentication
  #      against NPM_REGISTRY_URL (default: npm).
  #
  # The token path selects the .npmrc format from the registry host (override:
  # NPM_AUTH_STYLE):
  #   - Azure Artifacts (pkgs.dev.azure.com, *.pkgs.visualstudio.com):
  #     base64-encoded PAT in :_password for /npm/registry/ and /npm/, with
  #     always-auth=true. Azure requires this format for a PAT (:_authToken is
  #     only for in-pipeline OAuth tokens).
  #   - Other registries: bearer :_authToken.
  #
  # Fork configuration (Settings -> Secrets and variables -> Actions). Guides:
  # docs/setup/reusing-in-a-fork.md and
  # docs/setup/publishing-to-azure-artifacts.md.
  #   secret   NPM_TOKEN           An npm automation token. For Azure
  #                                Artifacts: a PAT with the Packaging
  #                                Read & write scope. Give the raw PAT; the
  #                                job encodes it in base64.
  #   variable NPM_REGISTRY_URL    The target registry. Default:
  #                                https://registry.npmjs.org. Azure example:
  #                                https://pkgs.dev.azure.com/ORG/PROJECT/_packaging/FEED/npm/registry/
  #                                (org-scoped feeds have no /PROJECT segment).
  #   variable NPM_PUBLISH_ACCESS  'public' (default) or 'restricted'. Use
  #                                'restricted' for a private feed.
  #   variable NPM_AUTH_STYLE      'password' (Azure base64 PAT) or 'token'
  #                                (bearer _authToken). The registry host sets
  #                                the default. Set the variable for a
  #                                self-hosted Azure DevOps Server URL.
  #   variable NPM_PROVENANCE      'true' attaches provenance on token-based
  #                                publications to npmjs.org. Other registries
  #                                ignore it (provenance is npm-only).
  publish:
    name: Publish package
    needs: release-please
    # Upstream: this job runs only when release-please made a release. Forks:
    # release-please does not run there, and the outputs of a skipped job are
    # empty strings, so this job runs on each push and on manual dispatch.
    # `!cancelled()` replaces the implicit success() check: a skipped
    # release-please does not block a fork, but a failed upstream
    # release-please blocks publication (release_created stays empty).
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || github.repository != 'cadesalaberry/vitest-sentry-reporter') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing + provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.21'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Setup Node for npm registry
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          # OIDC trusted publishing goes only to the public npm registry. The
          # token path below writes its own .npmrc for NPM_REGISTRY_URL.
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) requires npm >= 11.5.1. Node 20 has npm 10.x.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_REGISTRY_URL: ${{ vars.NPM_REGISTRY_URL }}
          NPM_PUBLISH_ACCESS: ${{ vars.NPM_PUBLISH_ACCESS }}
          NPM_AUTH_STYLE: ${{ vars.NPM_AUTH_STYLE }}
          NPM_PROVENANCE: ${{ vars.NPM_PROVENANCE }}
          UPSTREAM_REPO: cadesalaberry/vitest-sentry-reporter
        run: |
          set -euo pipefail
          access="${NPM_PUBLISH_ACCESS:-public}"

          # A fork without an NPM_TOKEN cannot publish: the OIDC path operates
          # only for the upstream Trusted Publisher. Stop without an error, so
          # that the run of a fork with no configuration stays successful.
          if [ -z "${NPM_TOKEN:-}" ] && [ "${GITHUB_REPOSITORY}" != "${UPSTREAM_REPO}" ]; then
            echo "No NPM_TOKEN configured and this is not the upstream repo — skipping publish."
            echo "To publish from a fork, set an NPM_TOKEN secret (and, for a private"
            echo "registry, the NPM_REGISTRY_URL / NPM_PUBLISH_ACCESS variables)."
            exit 0
          fi

          if [ -z "${NPM_TOKEN:-}" ]; then
            # Upstream default: npm Trusted Publishing (OIDC) to the public
            # registry, with provenance. This path uses no long-lived token.
            echo "Publishing to npm via Trusted Publishing (OIDC)."
            npm publish --provenance --access "${access}"
            exit 0
          fi

          # Token authentication: publish to NPM_REGISTRY_URL (default:
          # npmjs.org). The project-local .npmrc has priority over the
          # setup-node configuration.
          registry="${NPM_REGISTRY_URL:-https://registry.npmjs.org}"
          case "${registry}" in */) ;; *) registry="${registry}/" ;; esac
          host_path="${registry#*://}"   # host/path/ (scheme stripped)

          # Select the authentication format. Azure Artifacts requires a
          # base64-encoded PAT in :_password. All other npm-compatible
          # registries use a bearer :_authToken. The registry host sets the
          # default; NPM_AUTH_STYLE overrides it.
          style="${NPM_AUTH_STYLE:-}"
          if [ -z "${style}" ]; then
            case "${host_path}" in
              pkgs.dev.azure.com/*|*.pkgs.visualstudio.com/*) style=password ;;
              *) style=token ;;
            esac
          fi

          provenance=()
          if [ "${style}" = "password" ]; then
            # Azure Artifacts requires the PAT base64-encoded in :_password,
            # with credentials for the /npm/registry/ path (restore) and the
            # /npm/ feed root (publish). See docs/decisions/0011-*.md. The
            # .npmrc refers to the encoded PAT as ${AZURE_NPM_PASSWORD}, so the
            # value is not written in clear text, and the logs mask it.
            AZURE_NPM_PASSWORD="$(printf '%s' "${NPM_TOKEN}" | base64 -w0)"
            echo "::add-mask::${AZURE_NPM_PASSWORD}"
            export AZURE_NPM_PASSWORD
            keys=("//${host_path}")
            root_key="//${host_path%registry/}"
            if [ "${root_key}" != "//${host_path}" ]; then keys+=("${root_key}"); fi
            {
              echo "registry=${registry}"
              echo "always-auth=true"
              for key in "${keys[@]}"; do
                echo "${key}:username=vsts-npm-token"
                echo "${key}:_password=\${AZURE_NPM_PASSWORD}"
                echo "${key}:email=npm-requires-email@example.invalid"
              done
            } > .npmrc
            echo "Publishing to Azure Artifacts feed ${registry} (access=${access})."
          else
            # npm-compatible registry: bearer token as :_authToken. npm expands
            # ${NODE_AUTH_TOKEN} when it publishes, so the token is not written
            # in clear text.
            {
              echo "registry=${registry}"
              echo "always-auth=true"
              echo "//${host_path}:_authToken=\${NODE_AUTH_TOKEN}"
            } > .npmrc
            export NODE_AUTH_TOKEN="${NPM_TOKEN}"
            # Provenance requires the public npm registry. Set NPM_PROVENANCE to use it.
            if [ "${registry}" = "https://registry.npmjs.org/" ] && [ "${NPM_PROVENANCE:-}" = "true" ]; then
              provenance=(--provenance)
            fi
            echo "Publishing to ${registry} with a token (access=${access})."
          fi

          # Forks publish on each push to main (ADR-0012), and the version does
          # not change between upstream releases. If the registry already has
          # this version, stop. npm view uses the .npmrc from above (Azure
          # requires authentication for reads). If the check fails (E404,
          # network), continue to the publish command, which shows the real
          # error.
          pkg_name="$(node -p "require('./package.json').name")"
          pkg_version="$(node -p "require('./package.json').version")"
          pkg_spec="${pkg_name}@${pkg_version}"
          if npm view "${pkg_spec}" version --registry "${registry}" >/dev/null 2>&1; then
            echo "${pkg_spec} is already published to ${registry} — skipping publish."
            exit 0
          fi

          # A duplicate-version rejection is not an error: the registry
          # already has this exact version. Possible causes: two pushes at the
          # same time, or a version that the check above did not find.
          set +e
          publish_output="$(npm publish --registry "${registry}" --access "${access}" "${provenance[@]}" 2>&1)"
          publish_status=$?
          set -e
          printf '%s\n' "${publish_output}"
          if [ "${publish_status}" -ne 0 ]; then
            if printf '%s' "${publish_output}" | grep -qiE 'EPUBLISHCONFLICT|E409|409 Conflict|cannot publish over|already (exists|contains)'; then
              echo "${pkg_spec} was already on ${registry} — treating as published."
              exit 0
            fi
            exit "${publish_status}"
          fi
          echo "Published ${pkg_spec} to ${registry}."
