name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# The jobs only read the repository. Codecov authenticates with its own token.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each leg pins one Vitest major and one Sentry SDK major, so every
        # major that the peer ranges in package.json accept is tested.
        include:
          # Vitest 3 and 4 still support Node 20, so their legs keep testing the
          # oldest Node a consumer can run. Vitest 5 (the dev toolchain) uses the
          # version pinned in .nvmrc.
          - vitest: '3'
            sentry: '10'
            node: '20'
          - vitest: '4'
            sentry: '11'
            node: '20'
          - vitest: '5'
            sentry: '10'
            node-version-file: .nvmrc
          # The dev toolchain as locked in bun.lock. Only this leg collects
          # coverage.
          - vitest: '5'
            sentry: '11'
            node-version-file: .nvmrc
            coverage: true
    name: build-and-test (vitest ${{ matrix.vitest }}, sentry ${{ matrix.sentry }})
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes with git, so keep the token out of .git/config.
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Reads the version from the packageManager field.
          bun-version-file: package.json

      # Vitest 5 requires Node ^22.12.0 || ^24.0.0 || >=26.0.0. Pin Node per leg so the
      # test step does not depend on whatever version the runner image ships.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          node-version-file: ${{ matrix.node-version-file }}

      # --frozen-lockfile keeps CI in lockstep with the npm publish job
      # (.github/workflows/release.yml), which also installs frozen. Without it,
      # a stale bun.lock — e.g. a Dependabot bump that updates package.json but
      # not the lockfile — slips through CI, lands on main, and only fails later
      # when the release's frozen install rejects it. See docs/decisions/0006.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pin Vitest ${{ matrix.vitest }} and @sentry/node ${{ matrix.sentry }}
        run: bun add -d vitest@${{ matrix.vitest }} @sentry/node@${{ matrix.sentry }}

      - name: Build
        run: bun run build

      - name: Test
        if: ${{ !matrix.coverage }}
        run: bun run test run

      - name: Test with coverage
        if: ${{ matrix.coverage }}
        run: bun run test:coverage

      - name: Upload coverage to Codecov
        # Dependabot-triggered runs have no access to repository Actions
        # secrets, so CODECOV_TOKEN is empty and the upload falls back to a
        # tokenless attempt. Codecov rejects tokenless uploads for same-repo
        # branches ("Token required because branch is protected"), which then
        # fails the job via fail_ci_if_error. Skip the upload for Dependabot;
        # coverage is still uploaded on main pushes and regular PRs.
        if: matrix.coverage && github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # Derive the slug from the current repo so forks upload to their own
          # Codecov project without editing this workflow.
          slug: ${{ github.repository }}
          files: ./coverage/lcov.info
          # Install the uploader from PyPI to avoid the binary's GPG
          # signature self-check, which is unreliable on the runners.
          use_pypi: true
          # Only hard-fail on upload errors when a CODECOV_TOKEN is configured
          # (the upstream repo and any fork that sets one). A fork without the
          # token gets a tokenless best-effort upload that never fails CI.
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}

  quality:
    runs-on: ubuntu-latest
    name: lint & package checks
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes with git, so keep the token out of .git/config.
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Reads the version from the packageManager field.
          bun-version-file: package.json

      # Frozen install: see the note in the build-and-test job above.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint & format check (Biome)
        run: bunx biome ci .

      - name: Build
        run: bun run build

      - name: Validate package (publint)
        run: bunx publint

      - name: Validate types (are-the-types-wrong)
        run: bunx @arethetypeswrong/cli --pack . --profile esm-only



