name: PR Title

# Validates that the pull request title follows Conventional Commits so that
# release-please can derive the version bump and CHANGELOG entry from it when
# the PR is squash-merged (the squash commit defaults to the PR title).
#
# The validation logic lives in scripts/validate-pr-title.ts and is run here
# with Bun.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

# Only the title is read; no write access is needed.
permissions: {}

jobs:
  validate-pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes with git, so keep the token out of .git/config.
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Reads the version from the packageManager field.
          bun-version-file: package.json

      - name: Validate PR title
        # Passed via env to avoid shell injection from the untrusted title.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bun run scripts/validate-pr-title.ts
